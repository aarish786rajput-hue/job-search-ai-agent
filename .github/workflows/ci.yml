name: CI - Job Search AI Agent

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend (Python / FastAPI) Check
  # ──────────────────────────────────────────────
  backend-check:
    name: Backend - Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile app/api/auth.py
          python -m py_compile app/api/resume.py
          python -m py_compile app/api/applications.py
          python -m py_compile app/api/agent.py
          python -m py_compile app/services/resume_parser.py
          python -m py_compile app/agent/career_agent.py
          python -m py_compile app/core/database.py
          python -m py_compile app/models/user.py
          python -m py_compile app/models/application.py
          echo "✅ All Week 3 backend files passed syntax check!"

  # ──────────────────────────────────────────────
  # 2. Frontend (Next.js) Build Check
  # ──────────────────────────────────────────────
  frontend-check:
    name: Frontend - Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
          echo "✅ Frontend lint passed!"

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
          echo "✅ Frontend build passed!"
